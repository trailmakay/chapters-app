<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Chapters — Story of My Life</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3a2418">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chapters">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior-y: none;
    touch-action: manipulation;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  :root{
    --wood-1:#5a3d28; --wood-2:#3d2817; --wood-edge:#2a1a0e;
    --shelf-lip:#7a5638; --gold:#d9b45b; --gold-deep:#a8823a;
    --ink:#33281c; --paper:#f4ecd8; --paper-line:#d8c9a8;
  }

  body{ background:#241609; color:#f4ecd8; }

  /* ─────────── App container ─────────── */
  #app{ min-height:100%; }
  .view{ display:none; animation:fade .25s ease; }
  .view.active{ display:block; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }

  .safe-top{ padding-top: env(safe-area-inset-top); }
  .safe-bot{ padding-bottom: env(safe-area-inset-bottom); }

  /* ═══════════ BOOKSHELF (home) ═══════════ */
  #shelfView{
    min-height:100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,220,150,.10), transparent 60%),
      linear-gradient(160deg,#3a2617,#241207);
  }
  .shelf-head{
    padding: calc(env(safe-area-inset-top) + 22px) 20px 10px;
    display:flex; align-items:flex-end; justify-content:space-between;
  }
  .shelf-brand{ display:flex; align-items:center; gap:12px; }
  .shelf-logo{ width:52px; height:52px; border-radius:12px; flex:none; box-shadow:0 6px 14px rgba(0,0,0,.4); }
  .shelf-title{
    font-family: Georgia, "Times New Roman", serif;
    font-size:26px; font-weight:700; letter-spacing:.5px;
    color:var(--gold);
    text-shadow:0 1px 0 rgba(0,0,0,.6), 0 0 18px rgba(217,180,91,.25);
  }
  .shelf-sub{ font-size:12.5px; color:#c9b48f; opacity:.8; margin-top:2px; letter-spacing:2px; text-transform:uppercase; }

  .shelf-scroll{ padding: 8px 0 40px; }

  /* one wooden shelf row */
  .shelf-row-wrap{ padding: 0 16px; margin-bottom: 30px; }
  .books-row{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px 18px;
  }
  @media(min-width:520px){ .books-row{ grid-template-columns: repeat(3,1fr);} }

  /* the plank under the books */
  .shelf-plank{
    height:20px; margin: 2px 6px 0;
    border-radius: 3px;
    background:
      linear-gradient(180deg, var(--shelf-lip), var(--wood-1) 40%, var(--wood-2));
    box-shadow: 0 10px 22px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,220,170,.18);
    position:relative;
  }
  .shelf-plank::after{
    content:""; position:absolute; left:0; right:0; top:100%; height:12px;
    background:linear-gradient(180deg, rgba(0,0,0,.45), transparent);
  }

  /* ── a leather book cover ── */
  .book{
    position:relative;
    aspect-ratio: 3/4;
    border-radius: 6px 10px 10px 6px;
    padding:16px 14px;
    display:flex; flex-direction:column; justify-content:space-between;
    color:#f3e6c8;
    box-shadow:
      0 14px 26px rgba(0,0,0,.5),
      inset 0 0 0 1px rgba(0,0,0,.35),
      inset 3px 0 6px rgba(0,0,0,.4),
      inset -2px 0 5px rgba(255,255,255,.06);
    background-size: cover;
    overflow:hidden;
    transform: perspective(700px) rotateY(-4deg);
    transition: transform .12s ease;
  }
  .book:active{ transform: perspective(700px) rotateY(-1deg) scale(.98); }
  /* spine shading on the left */
  .book::before{
    content:""; position:absolute; top:0; bottom:0; left:0; width:14px;
    background:linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,0));
  }
  /* leather grain */
  .book::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.10), transparent 60%),
      radial-gradient(1px 1px at 70% 60%, rgba(0,0,0,.18), transparent 60%),
      repeating-linear-gradient(115deg, rgba(0,0,0,.05) 0 2px, transparent 2px 5px);
  }
  .book-frame{
    position:absolute; inset:10px; border-radius:4px;
    border:1.5px solid rgba(217,180,91,.55);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
    pointer-events:none;
  }
  .book-title{
    position:relative; z-index:2;
    font-family: Georgia, serif; font-weight:700;
    font-size:19px; line-height:1.15; text-align:center;
    margin-top:auto; margin-bottom:auto;
    color:var(--gold);
    text-shadow: 0 1px 0 rgba(0,0,0,.5), 0 0 1px rgba(217,180,91,.6);
    word-break:break-word;
  }
  .book-foot{
    position:relative; z-index:2; text-align:center;
    font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase;
    color: rgba(217,180,91,.75);
  }
  .book-emboss{
    position:relative; z-index:2; text-align:center; font-size:16px;
    color:rgba(217,180,91,.7);
  }
  /* small ribbon bookmark */
  .book-ribbon{
    position:absolute; top:-2px; right:16px; width:12px; height:34px; z-index:3;
    background:linear-gradient(180deg,#b23b3b,#7d2626);
    box-shadow:0 3px 5px rgba(0,0,0,.4);
    clip-path: polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);
  }

  /* Add-new book tile */
  .book.add-book{
    background: repeating-linear-gradient(135deg,#3a2617,#3a2617 10px,#412c1b 10px,#412c1b 20px);
    border:2px dashed rgba(217,180,91,.5);
    box-shadow: inset 0 0 30px rgba(0,0,0,.4);
    align-items:center; justify-content:center;
    transform:none;
  }
  .book.add-book:active{ transform:scale(.98); }
  .add-plus{ font-size:44px; color:var(--gold); line-height:1; }
  .add-label{ margin-top:8px; font-size:12px; letter-spacing:1px; color:#d9c39a; text-transform:uppercase; }

  /* Top 100 special book */
  .book.top100-book{
    background: linear-gradient(160deg,#1d2f22,#15241a);
  }
  .top100-star{ font-size:30px; color:var(--gold); text-align:center; position:relative; z-index:2; }

  /* ═══════════ READER ═══════════ */
  #readerView{ position:fixed; inset:0; background:#1a0f06; display:none; }
  #readerView.active{ display:block; }
  .reader-bar{
    position:absolute; top:0; left:0; right:0; z-index:20;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    display:flex; align-items:center; gap:8px;
    background: linear-gradient(180deg, rgba(20,12,6,.85), transparent);
  }
  .icon-btn{
    color:#e9d9b3; font-size:15px; padding:8px 10px; border-radius:10px;
    background:rgba(255,255,255,.06); display:flex; align-items:center; gap:6px;
  }
  .icon-btn:active{ background:rgba(255,255,255,.14); }
  .reader-spacer{ flex:1; }

  .stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    perspective: 2200px;
    background:
      radial-gradient(140% 90% at 50% 30%, rgba(60,40,20,.6), #140b04 75%);
  }
  /* the open-book frame holding the page */
  .book-open{
    position:relative;
    width: min(94vw, 460px);
    height: min(82vh, 720px);
    border-radius: 8px;
    background: linear-gradient(180deg,#2c1c10,#20130a);
    padding:10px;
    box-shadow: 0 30px 60px rgba(0,0,0,.6);
  }
  .page-stack{ position:relative; width:100%; height:100%; transform-style:preserve-3d; }

  .page{
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(0,0,0,.10), transparent 8%, transparent 92%, rgba(0,0,0,.06)),
      radial-gradient(120% 120% at 0% 0%, #fbf5e4, #efe3c6);
    border-radius: 4px 8px 8px 4px;
    box-shadow: inset 0 0 40px rgba(150,120,70,.18);
    display:flex; flex-direction:column;
    padding: 46px 24px 42px;
    color: var(--ink);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  /* faint left margin rule */
  .page::before{
    content:""; position:absolute; top:0; bottom:0; left:34px; width:1px;
    background: rgba(180,70,60,.28);
  }
  .page-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-left:16px; margin-bottom:10px;
    font-family: Georgia, serif;
  }
  .page-journal-name{ font-size:15px; font-weight:700; color:#6b4f2a; letter-spacing:.3px; }
  .page-date{ font-size:13px; color:#8a6a3b; text-align:right; white-space:nowrap; }
  .page-weekday{ font-size:11px; color:#a9895a; }

  .page-body{
    flex:1; margin-left:16px;
    font-size:19px; line-height:34px; color:var(--ink);
    border:none; outline:none; resize:none;
    width:100%; overflow-y:auto;
    font-family: Georgia, serif;
    padding:0;
    /* ruled lines live in the writing area, aligned to the text so you write ON the line */
    background-color: transparent;
    background-image: repeating-linear-gradient(180deg, transparent 0 33px, var(--paper-line) 33px 34px);
    background-attachment: local;
    background-position: 0 0;
  }
  .page-body::placeholder{ color:#b7a377; font-style:italic; }

  .page-foot{
    display:flex; align-items:center; justify-content:space-between;
    margin-left:16px; margin-top:8px;
  }
  .page-num{ font-family:Georgia,serif; font-size:12px; color:#9c7c4c; }
  .photo-slot{
    width:30px; height:30px; border-radius:5px;
    border:1px dashed rgba(120,90,50,.35);
    display:flex; align-items:center; justify-content:center;
    color:rgba(120,90,50,.4); font-size:13px;
    background:rgba(255,255,255,.15); overflow:hidden; flex:none;
    transition:.15s;
  }
  .photo-slot.has-photo{ border-style:solid; width:46px; height:46px; }
  .photo-slot img{ width:100%; height:100%; object-fit:cover; }

  /* turning leaf */
  .leaf{
    position:absolute; inset:0; transform-origin:left center;
    transform-style:preserve-3d; z-index:15; pointer-events:none;
    will-change:transform;
  }
  .leaf .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:4px 8px 8px 4px; overflow:hidden;
  }
  .leaf .back{ transform: rotateY(180deg); }
  .leaf-shade{ position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.25)); opacity:0; }

  .swipe-hint{
    position:absolute; bottom: calc(env(safe-area-inset-bottom) + 14px); left:0; right:0;
    text-align:center; font-size:12px; color:#b79a63; opacity:.7; z-index:5;
  }

  /* font menu */
  .font-menu{
    position:absolute; top: calc(env(safe-area-inset-top) + 52px); right:12px; z-index:30;
    background:#2a1c10; border:1px solid rgba(217,180,91,.35); border-radius:12px;
    padding:6px; display:none; box-shadow:0 14px 30px rgba(0,0,0,.5); width:200px;
  }
  .font-menu.open{ display:block; }
  .font-opt{
    padding:11px 12px; border-radius:8px; color:#f0e2be; font-size:17px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .font-opt:active{ background:rgba(255,255,255,.08); }
  .font-opt .tick{ color:var(--gold); opacity:0; }
  .font-opt.sel .tick{ opacity:1; }

  /* ═══════════ TOP 100 ═══════════ */
  #top100View{ min-height:100vh; background:linear-gradient(160deg,#16241a,#0e1911); }
  .t100-head{
    padding: calc(env(safe-area-inset-top) + 14px) 16px 10px;
    display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg,#16241a,rgba(22,36,26,.9));
    backdrop-filter: blur(6px);
  }
  .t100-title{ font-family:Georgia,serif; font-size:22px; color:var(--gold); font-weight:700; }
  .t100-prog{ font-size:12px; color:#9fc0a8; margin-left:auto; }
  .t100-list{ padding: 6px 14px 60px; }
  .goal{
    display:flex; align-items:flex-start; gap:12px;
    padding:12px 12px; margin-bottom:8px; border-radius:12px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
  }
  .goal.done{ background:rgba(217,180,91,.10); border-color:rgba(217,180,91,.3); }
  .goal-no{ font-family:Georgia,serif; font-size:13px; color:#7fa389; width:24px; text-align:right; padding-top:8px; flex:none; }
  .goal-check{
    width:26px; height:26px; border-radius:50%; flex:none; margin-top:4px;
    border:2px solid rgba(217,180,91,.55);
    display:flex; align-items:center; justify-content:center;
    color:#0e1911; font-size:15px; transition:.15s;
  }
  .goal.done .goal-check{ background:var(--gold); border-color:var(--gold); }
  .goal-main{ flex:1; }
  .goal-input{
    width:100%; background:transparent; border:none; outline:none;
    color:#eaf3ec; font-size:16px; padding:6px 0; line-height:1.4;
  }
  .goal.done .goal-input{ color:var(--gold); }
  .goal-input::placeholder{ color:#547a60; }
  .goal-reflect{
    margin-top:6px; font-size:13px; color:#bcd4c2;
    display:none; border-top:1px dashed rgba(255,255,255,.12); padding-top:8px;
  }
  .goal.done .goal-reflect{ display:block; }
  .goal-reflect textarea{
    width:100%; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.08);
    border-radius:8px; color:#dcebe0; font-size:14px; padding:8px; outline:none;
    resize:vertical; min-height:44px; line-height:1.5; font-family:inherit;
  }
  .reflect-label{ color:#8bb298; font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px; }

  /* ─────────── modal (name a journal) ─────────── */
  .modal-wrap{
    position:fixed; inset:0; z-index:200; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,.55); backdrop-filter:blur(3px);
  }
  .modal-wrap.open{ display:flex; }
  .modal{
    width:100%; max-width:360px; border-radius:18px; overflow:hidden;
    background:linear-gradient(180deg,#37241400,#2a1a0e), #3a2617;
    border:1px solid rgba(217,180,91,.3);
    box-shadow:0 30px 60px rgba(0,0,0,.6);
  }
  .modal h3{ font-family:Georgia,serif; color:var(--gold); padding:18px 18px 4px; font-size:19px; }
  .modal p{ padding:0 18px; color:#c9b48f; font-size:13px; }
  .modal-body{ padding:14px 18px 4px; }
  .modal input{
    width:100%; padding:13px 14px; border-radius:10px; font-size:16px;
    background:#241408; color:#f4ecd8; border:1px solid rgba(217,180,91,.3); outline:none;
  }
  .swatches{ display:flex; gap:10px; flex-wrap:wrap; }
  .swatch{ width:34px; height:34px; border-radius:8px; border:2px solid transparent; }
  .swatch.sel{ border-color:var(--gold); transform:scale(1.08); }
  .pick-label{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#c9b48f; opacity:.85; margin:16px 2px 8px; }
  .fontpick{ display:flex; flex-wrap:wrap; gap:8px; }
  .fontchip{
    padding:8px 13px; border-radius:9px; font-size:17px;
    background:#241408; color:#f0e2be;
    border:1.5px solid rgba(217,180,91,.28);
  }
  .fontchip.sel{ border-color:var(--gold); background:rgba(217,180,91,.14); }
  .modal-actions{ display:flex; gap:10px; padding:16px 18px calc(18px + env(safe-area-inset-bottom)); }
  .btn{
    flex:1; padding:13px; border-radius:11px; font-size:15px; font-weight:600;
    text-align:center;
  }
  .btn-ghost{ color:#d9c39a; background:rgba(255,255,255,.06); }
  .btn-gold{ color:#241408; background:linear-gradient(180deg,var(--gold),var(--gold-deep)); }

  .empty-shelf{ text-align:center; color:#b79a63; padding:60px 30px; }
  .empty-shelf .big{ font-size:40px; margin-bottom:10px; }

  .del-btn{ color:#e0a3a3; }
</style>
</head>
<body>
<div id="app">

  <!-- ═══════════ BOOKSHELF ═══════════ -->
  <div id="shelfView" class="view active">
    <div class="shelf-head">
      <div class="shelf-brand">
        <img src="icon-192.png" class="shelf-logo" alt="">
        <div>
          <div class="shelf-title">Chapters</div>
          <div class="shelf-sub">Story of my life</div>
        </div>
      </div>
    </div>
    <div class="shelf-scroll" id="shelfScroll"></div>
  </div>

  <!-- ═══════════ READER ═══════════ -->
  <div id="readerView" class="view">
    <div class="reader-bar safe-top">
      <button class="icon-btn" onclick="closeReader()">‹ Shelf</button>
      <div class="reader-spacer"></div>
      <button class="icon-btn" onclick="toggleFontMenu(event)">Aa</button>
      <button class="icon-btn del-btn" onclick="deleteJournalFromReader()">Delete</button>
    </div>
    <div class="font-menu" id="fontMenu"></div>
    <div class="stage" id="stage">
      <div class="book-open">
        <div class="page-stack" id="pageStack"></div>
      </div>
      <div class="swipe-hint" id="swipeHint">← swipe to flip pages →</div>
    </div>
  </div>

  <!-- ═══════════ TOP 100 ═══════════ -->
  <div id="top100View" class="view">
    <div class="t100-head">
      <button class="icon-btn" onclick="showShelf()">‹ Shelf</button>
      <div class="t100-title">Top 100</div>
      <div class="t100-prog" id="t100Prog">0 / 100</div>
    </div>
    <div class="t100-list" id="t100List"></div>
  </div>

</div>

<!-- new-journal modal -->
<div class="modal-wrap" id="modal">
  <div class="modal">
    <h3>New Journal</h3>
    <p>Name it, then pick a leather and a font.</p>
    <div class="modal-body">
      <input id="jName" placeholder="e.g. Travels, 2026, Gratitude…" maxlength="40">
      <div class="pick-label">Leather</div>
      <div class="swatches" id="swatches"></div>
      <div class="pick-label">Font</div>
      <div class="fontpick" id="fontpick"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="createJournal()">Create</button>
    </div>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" style="display:none">

<script>
/* ══════════════════════ DATA ══════════════════════ */
const KEY = 'leatherbound_v1';
const LEATHERS = [
  {name:'cognac',  a:'#8a5a34', b:'#5f3a1e'},
  {name:'oxblood', a:'#6e2f2f', b:'#421a1a'},
  {name:'forest',  a:'#39523c', b:'#213426'},
  {name:'navy',    a:'#33465f', b:'#1d2a3d'},
  {name:'onyx',    a:'#3a3a3a', b:'#1e1e1e'},
  {name:'tan',     a:'#9a7440', b:'#6a4c24'},
  {name:'plum',    a:'#5a3550', b:'#361f31'},
  {name:'teal',    a:'#2c5652', b:'#173432'},
];
const FONTS = [
  {id:'serif',   label:'Classic',    css:"Georgia, 'Times New Roman', serif"},
  {id:'hand',    label:'Handwritten',css:"'Snell Roundhand','Segoe Script','Bradley Hand',cursive"},
  {id:'marker',  label:'Marker',     css:"'Marker Felt','Comic Sans MS',cursive"},
  {id:'type',    label:'Typewriter', css:"'Courier New',Courier,monospace"},
  {id:'book',    label:'Bookish',    css:"'Palatino Linotype','Palatino','Book Antiqua',serif"},
  {id:'clean',   label:'Clean',      css:"-apple-system,'Helvetica Neue',Arial,sans-serif"},
];

function blank(){
  return { journals:[], top100:Array.from({length:100},()=>({text:'',done:false,reflection:''})) };
}
let store = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s&&s.journals) { if(!s.top100) s.top100=blank().top100; return s; } }catch(e){}
  return blank();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(store)); }

/* date helpers (local, ISO yyyy-mm-dd) */
function isoOf(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function todayISO(){ return isoOf(new Date()); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
function prettyDate(iso){ const d=parseISO(iso); return MO[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function weekday(iso){ return WD[parseISO(iso).getDay()]; }

/* ══════════════════════ SHELF ══════════════════════ */
function renderShelf(){
  const wrap = document.getElementById('shelfScroll');
  const books = [];

  // Top 100 always first
  books.push(`<div class="book top100-book" onclick="showTop100()">
      <div class="book-frame"></div>
      <div class="top100-star">★</div>
      <div class="book-title">Top&nbsp;100</div>
      <div class="book-foot">Life Goals</div>
    </div>`);

  store.journals.forEach((j,i)=>{
    const L = LEATHERS.find(l=>l.name===j.color)||LEATHERS[0];
    const bg = `linear-gradient(160deg, ${L.a}, ${L.b})`;
    const count = Object.values(j.entries||{}).filter(e=>e&&e.text&&e.text.trim()).length;
    books.push(`<div class="book" style="background:${bg}" onclick="openJournal('${j.id}')">
        <div class="book-frame"></div>
        <div class="book-ribbon"></div>
        <div class="book-emboss">❧</div>
        <div class="book-title">${escapeHtml(j.name)}</div>
        <div class="book-foot">${count?count+' entr'+(count===1?'y':'ies'):'Empty'}</div>
      </div>`);
  });

  // add-new tile
  books.push(`<div class="book add-book" onclick="openModal()">
      <div class="add-plus">+</div>
      <div class="add-label">New Journal</div>
    </div>`);

  // chunk into shelf rows of 2 (matches grid, gives each row a plank)
  const perRow = window.innerWidth>=520 ? 3 : 2;
  let html='';
  for(let i=0;i<books.length;i+=perRow){
    html += `<div class="shelf-row-wrap"><div class="books-row">${books.slice(i,i+perRow).join('')}</div><div class="shelf-plank"></div></div>`;
  }
  wrap.innerHTML = html;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ══════════════════════ MODAL ══════════════════════ */
let pickedColor = LEATHERS[0].name;
let pickedFont = 'serif';
function openModal(){
  document.getElementById('jName').value='';
  pickedColor = LEATHERS[Math.floor(Math.random()*LEATHERS.length)].name;
  pickedFont = 'serif';
  document.getElementById('swatches').innerHTML = LEATHERS.map(l=>
    `<div class="swatch ${l.name===pickedColor?'sel':''}" data-c="${l.name}"
       style="background:linear-gradient(160deg,${l.a},${l.b})" onclick="pickColor('${l.name}')"></div>`).join('');
  document.getElementById('fontpick').innerHTML = FONTS.map(f=>
    `<div class="fontchip ${f.id===pickedFont?'sel':''}" data-f="${f.id}"
       style="font-family:${f.css}" onclick="pickFont('${f.id}')">${f.label}</div>`).join('');
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('jName').focus(),120);
}
function pickColor(c){ pickedColor=c; document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('sel',s.dataset.c===c)); }
function pickFont(id){ pickedFont=id; document.querySelectorAll('.fontchip').forEach(c=>c.classList.toggle('sel',c.dataset.f===id)); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function createJournal(){
  let name = document.getElementById('jName').value.trim();
  if(!name) name = 'Journal '+(store.journals.length+1);
  const j = { id:'j'+Date.now(), name, color:pickedColor, font:pickedFont, created:todayISO(), entries:{} };
  store.journals.push(j); save(); closeModal(); renderShelf();
  openJournal(j.id);
}

/* ══════════════════════ READER ══════════════════════ */
let cur = null;        // current journal
let pageList = [];     // array of ISO dates
let idx = 0;           // current page index
let animating = false;

function buildPages(j){
  // pages = every date with a real entry  ∪  the last 30 days (this "month" is always flippable)
  const set = new Set();
  const t = todayISO();
  for(let i=29;i>=0;i--) set.add(addDays(t,-i));
  Object.keys(j.entries||{}).forEach(d=>{ if(j.entries[d] && (j.entries[d].text?.trim() || j.entries[d].photo)) set.add(d); });
  return [...set].sort();  // ascending ISO sorts chronologically
}

function openJournal(id){
  cur = store.journals.find(j=>j.id===id);
  if(!cur) return;
  if(!cur.font) cur.font='serif';
  pageList = buildPages(cur);
  idx = pageList.indexOf(todayISO());
  if(idx<0) idx = pageList.length-1;
  showView('readerView');
  renderPage();
  buildFontMenu();
  // hide hint after a few seconds
  const h=document.getElementById('swipeHint'); h.style.opacity='.7';
  clearTimeout(window._hintT); window._hintT=setTimeout(()=>h.style.opacity='0',3500);
}

function pageHTML(iso, pageNo){
  const e = (cur.entries&&cur.entries[iso])||{};
  const fontCss = (FONTS.find(f=>f.id===cur.font)||FONTS[0]).css;
  const photo = e.photo
    ? `<div class="photo-slot has-photo" onclick="pickPhoto('${iso}')"><img src="${e.photo}"></div>`
    : `<div class="photo-slot" onclick="pickPhoto('${iso}')">+</div>`;
  return `
    <div class="page-head">
      <div>
        <div class="page-journal-name">${escapeHtml(cur.name)}</div>
        <div class="page-weekday">${weekday(iso)}</div>
      </div>
      <div class="page-date">${prettyDate(iso)}</div>
    </div>
    <textarea class="page-body" placeholder="" style="font-family:${fontCss}"
      oninput="onWrite('${iso}',this.value)">${escapeHtml(e.text||'')}</textarea>
    <div class="page-foot">
      <span class="page-num">— ${pageNo} —</span>
      ${photo}
    </div>`;
}

function renderPage(){
  const iso = pageList[idx];
  const stack = document.getElementById('pageStack');
  stack.innerHTML = `<div class="page" id="curPage">${pageHTML(iso, idx+1)}</div>`;
}

function onWrite(iso,val){
  if(!cur.entries) cur.entries={};
  if(!cur.entries[iso]) cur.entries[iso]={text:'',photo:''};
  cur.entries[iso].text = val;
  save();
}

/* photo */
let photoTargetISO=null;
function pickPhoto(iso){ photoTargetISO=iso; document.getElementById('photoInput').click(); }
document.getElementById('photoInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f||!photoTargetISO) return;
  const rd=new FileReader();
  rd.onload=()=>{
    if(!cur.entries[photoTargetISO]) cur.entries[photoTargetISO]={text:'',photo:''};
    cur.entries[photoTargetISO].photo = rd.result; save(); renderPage();
  };
  rd.readAsDataURL(f);
  e.target.value='';
});

/* ── page flip animation ── */
function flip(dir){ // dir: +1 next (forward), -1 prev
  if(animating) return;
  const target = idx+dir;
  if(target<0 || target>=pageList.length) return;
  animating=true;
  document.getElementById('swipeHint').style.opacity='0';

  const stack = document.getElementById('pageStack');
  const curIso = pageList[idx];
  const nextIso = pageList[target];

  // destination page sits underneath
  const under = document.createElement('div');
  under.className='page';
  under.innerHTML = pageHTML(nextIso, target+1);
  under.style.zIndex=1;

  // the turning leaf
  const leaf = document.createElement('div');
  leaf.className='leaf';
  const front = document.createElement('div'); front.className='face front page';
  const back  = document.createElement('div'); back.className='face back page';
  const shade = document.createElement('div'); shade.className='leaf-shade';

  if(dir>0){
    front.innerHTML = pageHTML(curIso, idx+1);      // showing current, folds left
    back.innerHTML  = pageHTML(nextIso, target+1);
    leaf.style.transform='rotateY(0deg)';
  }else{
    front.innerHTML = pageHTML(nextIso, target+1);  // incoming page unfolds from left
    back.innerHTML  = pageHTML(curIso, idx+1);
    leaf.style.transform='rotateY(-180deg)';
  }
  leaf.appendChild(front); leaf.appendChild(back); leaf.appendChild(shade);

  stack.innerHTML='';
  stack.appendChild(under);
  stack.appendChild(leaf);

  requestAnimationFrame(()=>{
    leaf.style.transition='transform .55s cubic-bezier(.3,.1,.25,1)';
    shade.style.transition='opacity .55s ease';
    leaf.style.transform = dir>0 ? 'rotateY(-180deg)' : 'rotateY(0deg)';
    shade.style.opacity = dir>0 ? '.35' : '0';
  });
  setTimeout(()=>{
    idx=target; animating=false; renderPage();
  },560);
}

/* ── swipe / drag handling ── */
let sx=0, sy=0, swiping=false;
function bindSwipe(){
  const stage=document.getElementById('stage');
  stage.addEventListener('touchstart',e=>{ if(e.target.closest('textarea'))return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; swiping=true;},{passive:true});
  stage.addEventListener('touchend',e=>{
    if(!swiping)return; swiping=false;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ flip(dx<0?1:-1); }
  },{passive:true});
  // mouse (desktop testing)
  stage.addEventListener('mousedown',e=>{ if(e.target.closest('textarea'))return; sx=e.clientX; sy=e.clientY; swiping=true; });
  window.addEventListener('mouseup',e=>{ if(!swiping)return; swiping=false; const dx=e.clientX-sx,dy=e.clientY-sy; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)) flip(dx<0?1:-1); });
  // keyboard
  window.addEventListener('keydown',e=>{ if(!document.getElementById('readerView').classList.contains('active'))return; if(e.key==='ArrowRight')flip(1); if(e.key==='ArrowLeft')flip(-1); });
}

/* ── fonts ── */
function buildFontMenu(){
  document.getElementById('fontMenu').innerHTML = FONTS.map(f=>
    `<div class="font-opt ${f.id===cur.font?'sel':''}" onclick="setFont('${f.id}')" style="font-family:${f.css}">
       ${f.label}<span class="tick">✓</span></div>`).join('');
}
function toggleFontMenu(ev){ ev.stopPropagation(); document.getElementById('fontMenu').classList.toggle('open'); }
function setFont(id){ cur.font=id; save(); buildFontMenu(); renderPage(); document.getElementById('fontMenu').classList.remove('open'); }
document.addEventListener('click',e=>{ if(!e.target.closest('#fontMenu') && !e.target.closest('[onclick*="toggleFontMenu"]')) document.getElementById('fontMenu').classList.remove('open'); });

function deleteJournalFromReader(){
  const count = Object.values(cur.entries||{}).filter(e=>e&&(e.text?.trim()||e.photo)).length;
  const msg = count ? `Delete “${cur.name}”? It has ${count} written ${count===1?'entry':'entries'} — this cannot be undone.`
                    : `Delete “${cur.name}”?`;
  if(!confirm(msg)) return;
  store.journals = store.journals.filter(j=>j.id!==cur.id);
  save(); closeReader();
}
function closeReader(){ save(); showShelf(); }

/* ══════════════════════ TOP 100 ══════════════════════ */
function renderTop100(){
  const list=document.getElementById('t100List');
  let done=0;
  list.innerHTML = store.top100.map((g,i)=>{
    if(g.done) done++;
    return `<div class="goal ${g.done?'done':''}">
      <div class="goal-no">${i+1}</div>
      <div class="goal-check" onclick="toggleGoal(${i})">${g.done?'✓':''}</div>
      <div class="goal-main">
        <input class="goal-input" placeholder="Goal #${i+1}…" value="${escapeHtml(g.text)}"
          oninput="editGoal(${i},this.value)">
        <div class="goal-reflect">
          <div class="reflect-label">How I did it</div>
          <textarea placeholder="Tell the story of how you accomplished this…"
            oninput="editReflect(${i},this.value)">${escapeHtml(g.reflection)}</textarea>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('t100Prog').textContent = done+' / 100';
}
function toggleGoal(i){
  const g=store.top100[i];
  if(!g.done && !g.text.trim()){ // require a goal before checking
    const el=document.querySelectorAll('.goal-input')[i]; el.focus();
    el.placeholder='Write the goal first ✍️'; return;
  }
  g.done=!g.done; save(); renderTop100();
}
function editGoal(i,v){ store.top100[i].text=v; save(); }
function editReflect(i,v){ store.top100[i].reflection=v; save(); }

/* ══════════════════════ NAV ══════════════════════ */
function showView(id){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function showShelf(){ renderShelf(); showView('shelfView'); }
function showTop100(){ renderTop100(); showView('top100View'); }

/* boot */
renderShelf();
bindSwipe();
window.addEventListener('resize', ()=>{ if(document.getElementById('shelfView').classList.contains('active')) renderShelf(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
